name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Modelica Regression Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
      - name: Run tests
        run: nix run .#ci
      - name: Upload planning trajectories
        uses: actions/upload-artifact@v4
        with:
          name: planning-trajectories
          path: artifacts/planning
