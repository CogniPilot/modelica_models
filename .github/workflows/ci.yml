name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A feature-branch commit is tested by its pull-request run; after merge, the
# main-branch push gets its own run. Repeated events for the same commit replace
# an older run instead of starting another set of Nix cache clients.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Modelica Regression Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Check Modelica library structure
        run: tools/check-modelica-library.sh
      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true
          diagnostic-endpoint: ""
      - name: Run tests
        run: nix run .#ci
      - name: Upload planning trajectories
        uses: actions/upload-artifact@v7
        with:
          name: planning-trajectories
          path: artifacts/planning

  qualification:
    name: ${{ matrix.label }} Mission Qualification
    # Let regression tests populate the GitHub-hosted Nix cache before the
    # mission jobs start reading from it.
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Avoid having both vehicle jobs exhaust the GitHub Actions cache API
      # read/write rate limit at the same time.
      max-parallel: 1
      matrix:
        include:
          - vehicle: cubs2
            label: CUBS2
            figure: cubs2-qualification-summary.png
            report: qualification-report.html
          - vehicle: rdd2
            label: RDD2
            figure: rdd2-waypoint-summary.png
            report: waypoint-report.html

    steps:
      - uses: actions/checkout@v7
      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true
          diagnostic-endpoint: ""
      - id: qualify
        name: Run ${{ matrix.label }} qualification
        run: nix develop --command ${{ matrix.vehicle }}-qualification
      - id: verify-report
        name: Verify ${{ matrix.label }} qualification plots and report
        if: always()
        env:
          FIGURE_NAME: ${{ matrix.figure }}
          REPORT_NAME: ${{ matrix.report }}
          VEHICLE: ${{ matrix.vehicle }}
        run: |
          test -s "artifacts/vehicles/$VEHICLE/$FIGURE_NAME"
          test -s "artifacts/vehicles/$VEHICLE/$REPORT_NAME"
      - id: qualification-artifact
        name: Upload ${{ matrix.label }} qualification plots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vehicle-qualification-${{ matrix.vehicle }}
          path: artifacts/vehicles/${{ matrix.vehicle }}
          if-no-files-found: error
      - name: Link qualification report in job summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.qualification-artifact.outputs.artifact-url }}
          QUALIFICATION_OUTCOME: ${{ steps.qualify.outcome }}
          REPORT_OUTCOME: ${{ steps.verify-report.outcome }}
          REPORT_NAME: ${{ matrix.report }}
          VEHICLE_LABEL: ${{ matrix.label }}
          VEHICLE: ${{ matrix.vehicle }}
        run: |
          {
            printf '## %s mission qualification\n\n' "$VEHICLE_LABEL"
            printf 'Qualification: **%s**  \n' "$QUALIFICATION_OUTCOME"
            printf 'Plot and report: **%s**\n\n' "$REPORT_OUTCOME"
            if [ -n "$ARTIFACT_URL" ]; then
              printf '[Download the plots and self-contained HTML report](%s)\n\n' "$ARTIFACT_URL"
            fi
            printf 'Open **%s** from the artifact to view the qualification plots and checks.\n' "$REPORT_NAME"
            if [ "$VEHICLE" = rdd2 ]; then
              printf '\nThe RDD2 artifact contains directly viewable PNGs:\n\n'
              printf '%s\n' \
                '- `rdd2-waypoint-summary.png` (top-down trajectory)' \
                '- `rdd2-position-history.png` (east/north/altitude versus time)' \
                '- `rdd2-velocity-history.png` (ENU velocity versus time)' \
                '- `rdd2-nees-nis-consistency.png` (ESKF covariance consistency)' \
                '- `rdd2-estimator-consistency.png` (ESKF/UKF NEES and NIS)' \
                '- `rdd2-estimator-comparison.png` (accuracy and runtime comparison)'
              if [ -s artifacts/vehicles/rdd2/waypoint-summary.md ]; then
                printf '\n'
                cat artifacts/vehicles/rdd2/waypoint-summary.md
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
