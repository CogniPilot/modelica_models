name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A feature-branch commit is tested by its pull-request run; after merge, the
# main-branch push gets its own run. Repeated events for the same commit replace
# an older run instead of starting another set of Nix cache clients.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Modelica Regression Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Check Modelica library structure
        run: python -m tools.modelica_models_cli check-structure
      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - id: rumoca-runtime
        name: Identify pinned Rumoca runtime
        run: python -m tools.modelica_models_cli.nix_cache key --github-output
      - name: Restore pinned Rumoca runtime
        uses: actions/cache@v6
        with:
          path: .ci-cache/rumoca-runtime
          key: rumoca-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rumoca-runtime.outputs.key }}
      - name: Import or build pinned Rumoca runtime
        run: python -m tools.modelica_models_cli.nix_cache ensure .ci-cache/rumoca-runtime
      - name: Run tests
        run: nix run . -- test
      - name: Upload planning trajectories
        uses: actions/upload-artifact@v7
        with:
          name: planning-trajectories
          path: artifacts/planning

  qualification:
    name: ${{ matrix.label }} Mission Qualification
    # Let regression tests populate the GitHub-hosted Nix cache before the
    # mission jobs start reading from it.
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vehicle: cubs2
            label: CUBS2
            figure: cubs2-qualification-summary.png
            report: qualification-report.html
          - vehicle: rdd2
            label: RDD2
            figure: rdd2-waypoint-summary.png
            report: waypoint-report.html

    steps:
      - uses: actions/checkout@v7
      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - id: rumoca-runtime
        name: Identify pinned Rumoca runtime
        run: python -m tools.modelica_models_cli.nix_cache key --github-output
      - name: Restore pinned Rumoca runtime
        uses: actions/cache@v6
        with:
          path: .ci-cache/rumoca-runtime
          key: rumoca-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rumoca-runtime.outputs.key }}
      - name: Import or build pinned Rumoca runtime
        run: python -m tools.modelica_models_cli.nix_cache ensure .ci-cache/rumoca-runtime
      - id: qualify
        name: Run ${{ matrix.label }} qualification
        run: nix run . -- qualify ${{ matrix.vehicle }}
      - id: verify-report
        name: Verify ${{ matrix.label }} qualification plots and report
        if: always()
        env:
          FIGURE_NAME: ${{ matrix.figure }}
          REPORT_NAME: ${{ matrix.report }}
          VEHICLE: ${{ matrix.vehicle }}
        run: >-
          python -m tools.modelica_models_cli.github_actions verify
          --vehicle "$VEHICLE" --figure "$FIGURE_NAME" --report "$REPORT_NAME"
      - id: qualification-artifact
        name: Upload ${{ matrix.label }} qualification plots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vehicle-qualification-${{ matrix.vehicle }}
          path: artifacts/vehicles/${{ matrix.vehicle }}
          if-no-files-found: error
      - name: Link qualification report in job summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.qualification-artifact.outputs.artifact-url }}
          QUALIFICATION_OUTCOME: ${{ steps.qualify.outcome }}
          REPORT_OUTCOME: ${{ steps.verify-report.outcome }}
          REPORT_NAME: ${{ matrix.report }}
          VEHICLE_LABEL: ${{ matrix.label }}
          VEHICLE: ${{ matrix.vehicle }}
        run: >-
          python -m tools.modelica_models_cli.github_actions summary
          --vehicle "$VEHICLE" --label "$VEHICLE_LABEL" --report "$REPORT_NAME"
          --artifact-url "$ARTIFACT_URL"
          --qualification-outcome "$QUALIFICATION_OUTCOME"
          --report-outcome "$REPORT_OUTCOME"
